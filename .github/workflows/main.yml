# Steps 2-3. Runs on every push to main (a merged PR is a push to main).
name: Build and push

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.11.0"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run python -m unittest -v

      - id: version
        name: Read version
        run: |
          echo "version=$(uv version --short)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          IMAGE: ${{ vars.ECR_REPOSITORY_URL }}:${{ steps.version.outputs.version }}
        run: |
          docker build --tag atilla-service-code:1 .
          docker tag atilla-service-code:1 "$IMAGE"
          docker push "$IMAGE"
